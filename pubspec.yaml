name: pokedex
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  animate_do: ^5.1.0
  flutter:
    sdk: flutter
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.4
  provider: ^6.1.5+1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  image_path: "assets/icon/logo.png"
  android: "launcher_icon"
  web:
    generate: true 
    image_path: "path/to/image.png"

flutter:
  uses-material-design: true
  assets: 
    - assets/icon/
